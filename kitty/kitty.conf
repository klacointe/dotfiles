enable_audio_bell no
font_size 14.0

# BEGIN_KITTY_FONTS
font_family      family='InconsolataGo Nerd Font' postscript_name=InconsolataGoNF
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# GitHub Dark Dimmed
include current-theme.conf
# END_KITTY_THEME

# Clipboard - disable asking confirmation when paste in neovim
clipboard_control write-clipboard write-primary read-clipboard read-primary
